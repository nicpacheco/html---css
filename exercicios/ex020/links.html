<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            color: black;
            text-decoration: underline;
        }

        a::after{
            text-decoration: none;
            font-weight: normal;
            color: red;
        }

        a::before{
            text-decoration: none;
            font-weight: normal;
            color: red;    
        }

        .especial::before{
            content: '» ';
        }

        .especial::after{
            content: ' «';
        }
        
        .especial{
            background-color: rgb(215, 92, 92);
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://youtube.com/cursoemvideo/" rel="external" target="_blank">Youtube</a></li>
        <li><a href="https://gustavoguanabara.github.io" rel="external" target="_blank" class="especial">Github</a></li>
        <li><a href="https://www.cursoemvideo.com" rel="external" target="_blank">Site curso em viceo</a></li>
    </ul>    
</body>
</html>
