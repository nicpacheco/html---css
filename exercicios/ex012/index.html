<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video com HTML5</title>
</head>
<body>
    <h1>inserindo video hospedados localmente</h1>   
    <p>esse vídeo está inserido no meu próprio servidor</p>
    <video poster="imagens/thumb.png" width="500" controls autoplay loop>
        <source src="midia/VIDEO MP4 YT.mp4" type="video/mp4">
        <source src="midia/VIDEO MP4 YT.webm" type="video/webm">

    </video>
    <h1>Inserindo videos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/2Kji_xZlCgw?si=H8MECmtQHlcg-Otx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
