<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Love Larry';
            src: url('love larry.ttf') format('truetype'); 

            /*
                Tipos de format()
                - opentype (otf) 
                - truetype (ttf)
                - embedded-opentype
                - truetype-aat(Apple Advenced Typography)
                - svg
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'Love Larry', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Esse beatae, eligendi ut, amet illo maxime laudantium earum similique, dignissimos eius quas animi ipsam aliquam ea in cupiditate molestias perspiciatis necessitatibus?</p>    
</body>
</html>
