<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo caixas</title>
    <style>
        h1{
            text-align: center;
            background-color: lightgreen;
            width: 400px;
            height: 200px;
            border: 5px solid darkgreen;
            border-radius: 20px;
            padding: 5px;
            margin: auto;
        }

        a{
            padding: 2px;
            border-color: green;
            border-style: solid;
        }

        p{
            text-align: justify;
            text-align: center;
        }


    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de inline-level.</a>Vamos ver na prática como isso funciona.</p>  
</body>
</html>
